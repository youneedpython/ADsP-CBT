<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160"><style>
.waddle { transform-origin: 80px 150px; animation: waddle 1.6s ease-in-out infinite; }
.f-basic .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
.f-basic { animation: show-a 8s infinite; }
.f-happy { opacity: 0; animation: show-b 8s infinite; }
.tassel { transform-origin: 119.5px 35px; animation: sway 1.6s ease-in-out infinite; }
@keyframes waddle { 0%, 100% { transform: rotate(-4deg); } 25% { transform: translateY(-3px) rotate(0deg); } 50% { transform: rotate(4deg); } 75% { transform: translateY(-3px) rotate(0deg); } }
@keyframes blink { 0%, 90%, 96%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.08); } }
@keyframes show-a { 0%, 62%, 92%, 100% { opacity: 1; } 65%, 89% { opacity: 0; } }
@keyframes show-b { 0%, 62%, 92%, 100% { opacity: 0; } 65%, 89% { opacity: 1; } }
@keyframes sway { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(-5deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .f-happy { opacity: 0; } }
